# ============================================================================
# Trooth lint, as a GitHub Action. ADVISORY BY DEFAULT.
#
# Runs `trooth lint` on a directory in the checkout and writes what it read to
# the job summary: how many declaration files, from which sources, which
# regions, how many storage declarations and how many of those declare
# encryption, how many rules are open to any address, how many inline
# credential literals: counts and type names, never a file name, a line, a
# value or a snippet. Nothing is transmitted anywhere; lint is offline by
# construction (the CLI's own test points it at an unreachable API and proves
# zero requests leave).
#
# THERE IS NO VERDICT. lint reports what your infrastructure declares and does
# not judge it; declaring public ingress is not a failing, because a load
# balancer is supposed to be public. So this action does not fail your
# workflow over anything it reads unless you opt in, explicitly, to one of two
# gates that are yours to choose:
#
#   fail-on-inline-credentials   a credential literal in infrastructure code
#                                is unambiguous, and the count is only a count
#   fail-if-nothing-read         a directory that yields no declarations means
#                                the action is pointed at the wrong place
#
# AN INCOMPLETE READ FAILS BY DEFAULT. When lint skips a file over its size
# limit, cannot parse a file, cannot read one, or stops at its file limit, the
# counts describe part of the tree, and a green step would say otherwise. Set
# allow-incomplete: "true" to keep the step green; the summary still says the
# read was incomplete and how many files were not read.
#
# Everything else is a summary a person reads. A green run says the read
# happened; it does not say your infrastructure is good, and a summary here is
# not evidence that Trooth has ingested anything: nothing is sent to Trooth.
# The step does fail, as the action's own fault, when the read cannot happen
# at all: a path that does not exist, or a CLI that could not be installed or
# started.
#
# PERMISSIONS: none are needed beyond `contents: read` for the checkout. The
# action writes the job summary through the runner's own file, never through
# the API, so it needs no token and works on pull requests from forks.
#
# PIN THIS ACTION BY COMMIT. A tag such as v1 can be moved; a full commit SHA
# cannot. Use `uses: troothllc/trooth-action@<40-character SHA>  # v1`, and let
# Dependabot or Renovate propose updates you review.
#
# HOW THE CLI GETS THERE. It is installed from npm, pinned to one exact
# version (a range, a tag or a URL is refused), with install scripts disabled,
# and the installed package's own version is compared with the one asked for
# before it runs. npm checks the tarball against the registry's SHA-512
# integrity value as it installs. It goes into a directory under RUNNER_TEMP
# and is run by path. Not npx: npx resolves a name
# against the checked-out project first, which in a repository whose own
# package.json is named trooth runs a bin that was never linked and exits 127,
# and a run in which the read never happened must not show as successful. A
# run that could not install or start the CLI fails as the action's own fault,
# with the reason in the annotation.
# ============================================================================
name: "Trooth lint (advisory)"
description: "Read what your infrastructure declares (counts, sources, regions, encryption, open ingress, credential literals) into the job summary. lint runs offline and issues no verdict. The step fails if it cannot run, and otherwise only on the two gates you opt into."
author: "Trooth, LLC"
branding:
  icon: "eye"
  color: "blue"

inputs:
  path:
    description: "Directory to read. Relative to the workspace."
    required: false
    default: "."
  version:
    description: "Version of the `trooth` CLI to run from npm. Pinned on purpose; bump it deliberately."
    required: false
    default: "0.5.0"
  allow-incomplete:
    description: "Keep the step green when lint could not read every selected file (skipped, invalid or unreadable, or the walk hit its limit). The summary reports it either way."
    required: false
    default: "false"
  fail-on-inline-credentials:
    description: "Opt in: fail the step when lint counts one or more inline credential literals."
    required: false
    default: "false"
  fail-if-nothing-read:
    description: "Opt in: fail the step when the directory yields no infrastructure declarations."
    required: false
    default: "false"

outputs:
  facts-digest:
    description: "`sha256:` and a SHA-256 over the report's `facts` object in canonical form. An aggregate: two different trees with the same counts share it. It does not identify file contents, a repository, a commit or a deployment. Empty when nothing was read."
    value: ${{ steps.lint.outputs.facts-digest }}
  digest:
    description: "The same value as facts-digest, under its 0.4 name. Kept for existing workflows; use facts-digest."
    value: ${{ steps.lint.outputs.digest }}
  completeness:
    description: "`complete` or `incomplete`: whether every selected file was read."
    value: ${{ steps.lint.outputs.completeness }}
  declarations-read:
    description: "How many declaration files were read."
    value: ${{ steps.lint.outputs.declarations-read }}
  inline-credential-literals:
    description: "How many inline credential literals were counted. A count; the literals are never printed."
    value: ${{ steps.lint.outputs.inline-credential-literals }}
  report:
    description: "Path to this step's own JSON fact document, for `actions/upload-artifact`. Each invocation writes to its own directory, so two steps in one job never overwrite each other's report."
    value: ${{ steps.lint.outputs.report }}

runs:
  using: "composite"
  steps:
    - id: lint
      shell: bash
      env:
        TROOTH_LINT_PATH: ${{ inputs.path }}
        TROOTH_CLI_VERSION: ${{ inputs.version }}
        TROOTH_FAIL_ON_INLINE_CREDENTIALS: ${{ inputs.fail-on-inline-credentials }}
        TROOTH_FAIL_IF_NOTHING_READ: ${{ inputs.fail-if-nothing-read }}
        TROOTH_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
        # lint never calls this, and the CLI's own test proves it; pointing it at
        # an unroutable address makes that a property of this action too.
        TROOTH_API: "http://127.0.0.1:9"
      run: |
        set -uo pipefail
        V="$TROOTH_CLI_VERSION"
        # ONE EXACT VERSION. A range, a dist-tag, a URL or a path would let an
        # input decide what code runs; only MAJOR.MINOR.PATCH is accepted.
        if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error title=Trooth lint::version must be one exact release such as 0.5.0; got '$V'"; exit 2
        fi
        # EACH INVOCATION GETS ITS OWN DIRECTORY. Up to 0.4.4 every step in a job
        # wrote RUNNER_TEMP/trooth-lint.json, so a second step overwrote the
        # first step's report before it could be uploaded.
        OUT_DIR="$(mktemp -d "$RUNNER_TEMP/trooth-lint.XXXXXXXX")"
        REPORT="$OUT_DIR/trooth-lint.json"
        ERR="$OUT_DIR/trooth-lint.stderr"
        : > "$REPORT"; : > "$ERR"
        # THE CLI IS INSTALLED INTO ITS OWN DIRECTORY AND RUN BY PATH, NOT THROUGH
        # npx. npx resolves a package name against the checked-out project before
        # it asks the registry, and in a repository whose own package.json is
        # named trooth (trooth-cli is one) it then runs a bin that was never
        # linked and exits 127. The self-test found that on its first run. A directory under
        # RUNNER_TEMP is also the same place on every run and every runner.
        CLI_DIR="$RUNNER_TEMP/trooth-cli-$V"
        TROOTH_BIN="$CLI_DIR/node_modules/trooth/bin/trooth.mjs"
        set +e
        if [ ! -f "$TROOTH_BIN" ]; then
          mkdir -p "$CLI_DIR"
          npm install --prefix "$CLI_DIR" --no-save --no-audit --no-fund --no-package-lock --ignore-scripts --loglevel=error "trooth@$V" >/dev/null 2> "$OUT_DIR/install.stderr"
        fi
        PKG="$CLI_DIR/node_modules/trooth/package.json"
        if [ -f "$PKG" ] && [ "$(node -p 'require(process.argv[1]).version' "$PKG" 2>/dev/null)" != "$V" ]; then
          printf 'trooth: the installed package is not version %s\n' "$V" > "$ERR"; TROOTH_BIN=""
        fi
        if [ -n "$TROOTH_BIN" ] && [ -f "$TROOTH_BIN" ]; then
          node "$TROOTH_BIN" lint "$TROOTH_LINT_PATH" --json > "$REPORT" 2> "$ERR"
          CODE=$?
        else
          [ -s "$ERR" ] || printf 'trooth: could not install trooth@%s from npm: %s\n' "$V" "$(tr '\n' ' ' < "$OUT_DIR/install.stderr" 2>/dev/null | head -c 200)" > "$ERR"
          CODE=2
        fi
        # An exit the CLI does not define (a runtime that could not start, a
        # signal) means the read did not happen, and a step that did not read
        # must not be green. It is reported the way a usage error is.
        case "$CODE" in 0|1|2|4) ;; *) { printf 'trooth: the CLI exited with code %s before producing a report\n' "$CODE"; cat "$ERR"; } > "$ERR.2"; mv "$ERR.2" "$ERR"; CODE=2;; esac
        set -e
        node "$GITHUB_ACTION_PATH/action/summary.mjs" "$REPORT" "$CODE" "$ERR" >> "$GITHUB_STEP_SUMMARY"
        node "$GITHUB_ACTION_PATH/action/outputs.mjs" "$REPORT" "$CODE" >> "$GITHUB_OUTPUT"
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"
        # Exit code 3 (upstream) cannot happen for lint; exit code 2 is the
        # action's own fault (a path that does not exist, or a CLI that could not
        # be installed or did not run) and is always a failure, because nothing
        # was read. Exit code 4 is an incomplete read.
        if [ "$CODE" = "2" ]; then echo "::error title=Trooth lint::$(head -n 1 "$ERR" | head -c 300)"; exit 2; fi
        if [ "$CODE" = "4" ] && [ "$TROOTH_ALLOW_INCOMPLETE" != "true" ]; then echo "::error title=Trooth lint::the read was incomplete: some selected files were skipped, invalid or unreadable. The summary has the counts; set allow-incomplete to keep the step green."; exit 4; fi
        if [ "$CODE" = "1" ] && [ "$TROOTH_FAIL_IF_NOTHING_READ" = "true" ]; then echo "::error title=Trooth lint::no infrastructure declarations were found under $TROOTH_LINT_PATH, and fail-if-nothing-read is on"; exit 1; fi
        if { [ "$CODE" = "0" ] || [ "$CODE" = "4" ]; } && [ "$TROOTH_FAIL_ON_INLINE_CREDENTIALS" = "true" ]; then
          N="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(j.facts.inline_credential_literals|0)' "$REPORT")"
          if [ "$N" != "0" ]; then echo "::error title=Trooth lint::$N inline credential literal(s) counted, and fail-on-inline-credentials is on. The literals were not printed; find them with your own tooling."; exit 1; fi
        fi
        exit 0
