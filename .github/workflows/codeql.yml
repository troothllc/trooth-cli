name: CodeQL

# Automated security scanning of the guard and everything else in this
# repository: GitHub CodeQL over the JavaScript (bin/, tests/, scripts/,
# pilots/js) and the Python (sdk/python, pilots/py). Results go to the
# repository's code scanning alerts. Part of the internal review gate
# (docs/GUARD-THREAT-MODEL.md, "Review status"); it is not an outside review.
#
# Actions are pinned by full commit SHA, with the release tag in a comment.
# The SHAs were read on 2026-10-07 with `git ls-remote --tags` against
# github.com (the commit each release tag points to). codeql-action is pinned
# at v4 (v4.38.2), the current major; v3 runs on Node 20, which GitHub is retiring.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
