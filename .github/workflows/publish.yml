name: Publish to npm

# Publishes `trooth` to the npm registry when a version tag (v0.6.0, v0.6.1,
# ...) is pushed, with a provenance statement that ties the tarball to this
# repository, this workflow file and the commit it was built from.
#
# HOW IT AUTHENTICATES: npm trusted publishing (OpenID Connect). There is no
# npm token in this repository's secrets and none is read here. GitHub issues
# a short-lived OIDC token to this job (`id-token: write`), and npm exchanges
# it for a publish credential that only this workflow file in this repository
# can obtain. Provenance is generated by npm for a trusted publish; the
# explicit --provenance flag below makes that a stated requirement of this
# step rather than a default it relies on.
#   https://docs.npmjs.com/trusted-publishers
#   https://docs.npmjs.com/generating-provenance-statements
#
# ONE ACT OUTSIDE THIS FILE: the trusted publisher must be registered on
# npmjs.com by a maintainer of the `trooth` package (package Settings >
# Trusted Publisher > GitHub Actions) with exactly:
#   Organization or user   troothllc
#   Repository             trooth-cli
#   Workflow filename      publish.yml
#   Environment name       (leave empty)
# Until that is done, `npm publish` in this job fails with an authentication
# error and nothing is published.
#
# Requirements npm states for trusted publishing, met below: npm CLI 11.5.1
# or later, Node 22.14.0 or later, and package.json repository.url equal to
# this repository (git+https://github.com/troothllc/trooth-cli.git, held by
# tests/check-metadata.mjs).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, then publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusted publishing exchanges; nothing else
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: npm 11.5.1 or later (trusted publishing needs it)
        run: |
          npm install -g npm@^11.5.1
          node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm too old for trusted publishing');process.exit(1)}"
          node --version
          npm --version

      - name: The tag is the package version
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; }

      - name: Install from the lock, scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: The version the binary prints is the tag
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "$(node bin/trooth.mjs --version)" = "$V" ] || { echo "::error::trooth --version does not print $V"; exit 1; }

      - name: Metadata and the test suite
        run: |
          node tests/check-metadata.mjs
          npm test

      - name: The tarball that will be published
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --provenance --access public
