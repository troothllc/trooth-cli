name: Publish to npm

# Publishes `trooth` to the npm registry when a version tag (v0.6.0, v0.6.1,
# ...) is pushed, with a provenance statement that ties the tarball to this
# repository, this workflow file and the commit it was built from.
#
# HOW IT AUTHENTICATES: npm trusted publishing (OpenID Connect). There is no
# npm token in this repository's secrets and none is read here. GitHub issues
# a short-lived OIDC token to this job (`id-token: write`), and npm exchanges
# it for a publish credential that only this workflow file in this repository
# can obtain. Provenance is generated by npm for a trusted publish; the
# explicit --provenance flag below makes that a stated requirement of this
# step rather than a default it relies on.
#   https://docs.npmjs.com/trusted-publishers
#   https://docs.npmjs.com/generating-provenance-statements
#
# ONE ACT OUTSIDE THIS FILE: the trusted publisher must be registered on
# npmjs.com by a maintainer of the `trooth` package (package Settings >
# Trusted Publisher > GitHub Actions) with exactly:
#   Organization or user   troothllc
#   Repository             trooth-cli
#   Workflow filename      publish.yml
#   Environment name       (leave empty)
# Until that is done, `npm publish` in this job fails with an authentication
# error and nothing is published.
#
# WHAT EACH RELEASE CARRIES (golive231, tracker C4): the exact tarball npm serves, its CycloneDX SBOM, a SHA256SUMS
# file, and a Sigstore bundle for each (cosign keyless: the signing certificate names this workflow at this tag, and
# the signature is logged in Rekor, the public transparency log). They are attached to the GitHub release for the tag.
# The tarball is packed once and that file is the one published, so the signed bytes are the published bytes.
# docs/RELEASES.md shows how anyone checks them.
#   https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
#   https://docs.npmjs.com/cli/v11/commands/npm-sbom
#
# Requirements npm states for trusted publishing, met below: npm CLI 11.5.1
# or later, Node 22.14.0 or later, and package.json repository.url equal to
# this repository (git+https://github.com/troothllc/trooth-cli.git, held by
# tests/check-metadata.mjs).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, then publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release for this tag and its files; nothing else in the repository is written
      id-token: write # the OIDC token npm trusted publishing and Sigstore keyless signing exchange; nothing else
      attestations: write # C4a: GitHub's build provenance attestation for the release files
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: npm 11.5.1 or later (trusted publishing needs it)
        run: |
          npm install -g npm@^11.5.1
          node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm too old for trusted publishing');process.exit(1)}"
          node --version
          npm --version

      - name: The tag is the package version
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; }

      - name: Install from the lock, scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: The version the binary prints is the tag
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "$(node bin/trooth.mjs --version)" = "$V" ] || { echo "::error::trooth --version does not print $V"; exit 1; }

      - name: Metadata and the test suite
        run: |
          node tests/check-metadata.mjs
          npm test

      - name: Pack the tarball once; this file is the one published and signed
        run: |
          mkdir -p release
          npm pack --pack-destination release
          V="$(node -p "require('./package.json').version")"
          [ -f "release/trooth-$V.tgz" ] || { echo "::error::npm pack did not write release/trooth-$V.tgz"; exit 1; }

      - name: Publish that tarball with provenance
        run: npm publish "release/trooth-$(node -p "require('./package.json').version").tgz" --provenance --access public

      - name: SBOM and checksums for the release
        run: |
          V="$(node -p "require('./package.json').version")"
          npm sbom --sbom-format cyclonedx --omit dev > "release/trooth-$V.cdx.json"
          cd release && sha256sum "trooth-$V.tgz" "trooth-$V.cdx.json" > SHA256SUMS && cat SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      - name: Sign each release file (cosign keyless, logged in Rekor)
        run: |
          cd release
          for f in trooth-*.tgz trooth-*.cdx.json SHA256SUMS; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
          ls -l

      # C4a (tracker, 2026-11-08): SLSA build provenance from a hosted builder. GitHub signs, with Sigstore, a
      # statement that these exact files were built by this workflow at this commit on GitHub's runners, and keeps it
      # in the repository's attestations; anyone checks it with: gh attestation verify <file> --repo troothllc/trooth-cli
      # (SLSA Build L2 needs provenance a hosted platform generates; a workstation build cannot give it).
      # https://docs.github.com/actions/security-for-github-actions/using-artifact-attestations
      - name: Build provenance for each release file (SLSA, GitHub artifact attestation)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/trooth-*.tgz
            release/trooth-*.cdx.json
            release/SHA256SUMS

      - name: The GitHub release for this tag, with every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "trooth $GITHUB_REF_NAME" --notes "See CHANGELOG.md. Check these files with docs/RELEASES.md."
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
