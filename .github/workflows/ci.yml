name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test on Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Smoke test (help)
        run: node bin/trooth --help

      - name: Smoke test (version)
        run: node bin/trooth --version

      - name: Smoke test (scan in scaffold mode)
        env:
          TROOTH_API_KEY: smoke-test-key
        run: node bin/trooth scan --fail-on none --json --host http://localhost:9
