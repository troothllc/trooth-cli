name: CI

# The previous version of this file tested a package that is no longer here.
# It ran `node bin/trooth --help` against a file that does not exist, and
# `trooth scan`, a command removed in 0.4.0. Everything it asserted was about
# @trooth/cli 0.1.0. This one tests what the repository actually ships.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # ONE DEPENDENCY, on purpose: the maintained YAML parser, so Kubernetes
      # files are parsed rather than pattern-matched. It has no dependencies of
      # its own. This step holds the line: exactly one, pinned exactly, locked
      # in npm-shrinkwrap.json, installed with install scripts off.
      - name: One pinned dependency, installed from the lock
        run: |
          node -e "const p=require('./package.json');const d=p.dependencies||{};const k=Object.keys(d);if(k.length!==1||k[0]!=='yaml'||!/^\d+\.\d+\.\d+$/.test(d.yaml)){console.error('expected exactly yaml at an exact version, found',d);process.exit(1)}"
          test -f npm-shrinkwrap.json
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Version and help
        run: |
          node bin/trooth.mjs --version
          node bin/trooth.mjs --help > /dev/null

      - name: lint reads a declared tree and exits 0
        run: node bin/trooth.mjs lint tests/fixtures/infra

      - name: lint --json emits exactly one JSON document on stdout
        run: |
          node bin/trooth.mjs lint tests/fixtures/infra --json > out.json
          node -e "const d=require('./out.json'); if(!d.facts_digest || d.coverage.completeness!=='complete') { throw new Error('no digest, or an incomplete read'); }"

      - name: lint says so, rather than failing, when there is nothing to read
        run: |
          mkdir -p empty
          set +e; node bin/trooth.mjs lint empty > /dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "1" ] || { echo "expected exit 1 (finding), got $rc"; exit 1; }

      - name: a retired command explains itself instead of saying "unknown"
        run: |
          for cmd in scan eu; do
            set +e; out=$(node bin/trooth.mjs "$cmd" 2>&1); rc=$?; set -e
            [ "$rc" = "2" ] || { echo "$cmd: expected exit 2, got $rc"; exit 1; }
            echo "$out" | grep -qi "retired" || { echo "$cmd: does not say it is retired"; exit 1; }
          done

      - name: an unknown flag is a usage error, not a crash
        run: |
          set +e; node bin/trooth.mjs --no-such-flag > /dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "2" ] || { echo "expected exit 2, got $rc"; exit 1; }

  metadata:
    name: One license, one version, one description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/check-metadata.mjs

      # The action tests and the lint tests. Run once, on one Node, because
      # they read fixtures by path and assert exact counts.
      - name: The test suite
        run: npm test

      # What npm would actually ship, printed, so a file that should not be in
      # the tarball is visible in the log before it is visible on the registry.
      - name: The published tarball
        run: npm pack --dry-run
