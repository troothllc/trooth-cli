\* TLC configuration for GuardDecision.tla: three rules, one witness required,
\* zero to two witnesses cosigning. Run:
\*   java -cp tla2tools.jar tlc2.TLC -workers auto -config GuardDecision.cfg GuardDecision.tla
CONSTANTS
  MaxRules = 3
  MinWitnesses = 1
  MaxWitnesses = 2
SPECIFICATION Spec
INVARIANTS
  TypeOK
  AllowOnlyWithEvidence
  UnreachableNeverAllows
  DenyOnlyForProofOrAbsolute
  MissingEvidenceOnlyHolds
  Deterministic
